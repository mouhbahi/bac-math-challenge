<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحدي الباكالوريا — النسخة الشاملة</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --border: #263244;
      --text: #eef2f7;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --green: #16a34a;
      --yellow: #eab308;
      --gray: #475569;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 16px; }
    .container { max-width: 1080px; margin: 0 auto; }
    .auth-box {
      max-width: 410px; margin: 56px auto; background: var(--card);
      border: 1px solid var(--border); border-radius: 14px; padding: 24px;
    }
    input, select, button {
      width: 100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); padding: 10px 12px;
      border-radius: 8px; margin-bottom: 12px; font-size: 14px;
    }
    button { cursor: pointer; font-weight: 600; transition: 0.15s; }
    button.primary { background: var(--accent); border-color: var(--accent); }
    button.ghost { background: transparent; color: var(--muted); }
    header, .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; margin-bottom: 16px;
    }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .pills { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .pill {
      background: var(--bg); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 10px; font-size: 14px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 16px; }
    .lesson {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border);
    }
    .lesson:last-child { border-bottom: none; }
    .lesson select { width: auto; margin: 0; padding: 6px 10px; }
    .badge {
      font-size: 12px; padding: 3px 9px; border-radius: 999px;
      color: #fff; display: inline-block; margin-top: 4px;
    }
    .unlocked { background: var(--green); }
    .active { background: var(--yellow); color: #000; font-weight: 600; }
    .locked { background: var(--gray); }
    .leader-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; border-radius: 10px; background: var(--bg);
      border: 1px solid var(--border); margin-bottom: 8px; font-size: 14px;
    }
    .error { color: var(--danger); font-size: 13px; margin-bottom: 10px; min-height: 18px; }
    .scope-list { margin: 8px 0 0 0; padding-right: 18px; line-height: 1.7; font-size: 14px; }
  </style>
</head>
<body>

  <!-- شاشة الدخول / إنشاء حساب باسم المستخدم وكلمة السر -->
  <div id="auth-screen" class="auth-box">
    <h2 id="auth-heading" style="margin-top:0; text-align:center;">دخول الطلاب — تحدي الباكالوريا</h2>
    <div id="auth-error" class="error"></div>
    <input type="text" id="auth-username" placeholder="اسم المستخدم (مثال: mohamed_2027)" autocomplete="username" />
    <input type="password" id="auth-password" placeholder="كلمة السر (6 أحرف أو أكثر)" autocomplete="current-password" />
    <select id="auth-stream" style="display:none;">
      <option value="علوم تجريبية">شعبة العلوم التجريبية</option>
      <option value="رياضيات">شعبة الرياضيات</option>
      <option value="تقني رياضي">شعبة تقني رياضي</option>
    </select>
    <button class="primary" id="auth-submit" onclick="submitAuth()">دخول</button>
    <button class="ghost" id="auth-switch" onclick="toggleMode()">حساب جديد؟ أنشئ حساباً باسم مستخدم وكلمة سر</button>
  </div>

  <!-- المنصة الرئيسية بعد تسجيل الدخول -->
  <div id="main-screen" class="container" style="display:none;">
    <header>
      <div>
        <h2 style="margin:0;">أهلاً، <span id="me-username"></span></h2>
        <small style="color:var(--muted);">الشعبة: <span id="me-stream"></span> • قاعدة بيانات جديدة مستقلة</small>
      </div>
      <div class="pills">
        <div class="pill">النقاط: <strong id="me-xp">0</strong> XP</div>
        <div class="pill">الرتبة: <strong id="me-rank">مبتدئ</strong></div>
        <button style="width:auto; margin:0;" onclick="logout()">خروج</button>
      </div>
    </header>

    <div class="grid">
      <!-- مسار الدروس -->
      <div class="card">
        <h3 style="margin-top:0;">الرياضيات — مسار الدروس</h3>
        <div id="lessons-container"></div>
      </div>

      <!-- التحدي ونطاق الدروس المفتوحة -->
      <div class="card">
        <h3 style="margin-top:0;">التحدي المسموح حسب تقدمك</h3>
        <p style="color:var(--muted); margin:0; font-size:13px;">
          يعتمد التحدي فقط على الدروس (مفتوح للاختبار / قيد الدراسة) ويستبعد المقفول.
        </p>
        <ul id="scope-container" class="scope-list"></ul>
        <button class="primary" style="margin-top:16px;" onclick="completeChallenge()">
          إتمام تحدٍ في الدروس المفتوحة (+75 XP)
        </button>
      </div>

      <!-- لوحة الترتيب التنافسية -->
      <div class="card">
        <h3 style="margin-top:0;">لوحة الترتيب التنافسية (XP)</h3>
        <div id="leaderboard-container"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    // ضع إعدادات مشروع Firebase الجديد هنا
    const firebaseConfig = {
      apiKey: "YOUR_NEW_API_KEY",
      authDomain: "YOUR_NEW_PROJECT.firebaseapp.com",
      projectId: "YOUR_NEW_PROJECT_ID",
      storageBucket: "YOUR_NEW_PROJECT.appspot.com",
      messagingSenderId: "YOUR_NEW_SENDER_ID",
      appId: "YOUR_NEW_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const INITIAL_LESSONS = [
      { id: 1, title: "الدوال العددية (نهايات، اشتقاق، فروع، مناقشة)", status: "unlocked" },
      { id: 2, title: "المتتاليات العددية", status: "active" },
      { id: 3, title: "الأعداد المركبة", status: "locked" },
      { id: 4, title: "الدوال الأصلية والتكامل", status: "locked" },
      { id: 5, title: "الاحتمالات", status: "locked" }
    ];

    let isSignup = false;
    let currentUser = null;
    let profile = null;
    let unsubLeaderboard = null;

    function normalizeUsername(raw) {
      return raw.trim().toLowerCase().replace(/[^a-z0-9._-]/g, "");
    }

    function toInternalEmail(cleanUser) {
      return `${cleanUser}@bac-challenge.local`;
    }

    window.toggleMode = () => {
      isSignup = !isSignup;
      document.getElementById("auth-error").textContent = "";
      document.getElementById("auth-heading").textContent = isSignup
        ? "إنشاء حساب جديد — تحدي الباكالوريا"
        : "دخول الطلاب — تحدي الباكالوريا";
      document.getElementById("auth-stream").style.display = isSignup ? "block" : "none";
      document.getElementById("auth-submit").textContent = isSignup ? "إنشاء الحساب" : "دخول";
      document.getElementById("auth-switch").textContent = isSignup
        ? "لدي حساب بالفعل؟ تسجيل الدخول"
        : "حساب جديد؟ أنشئ حساباً باسم مستخدم وكلمة سر";
    };

    window.submitAuth = async () => {
      const errEl = document.getElementById("auth-error");
      errEl.textContent = "";
      const rawUser = document.getElementById("auth-username").value;
      const cleanUser = normalizeUsername(rawUser);
      const password = document.getElementById("auth-password").value;

      if (cleanUser.length < 3) {
        errEl.textContent = "اكتب اسم مستخدم من 3 أحرف/أرقام إنجليزية على الأقل (مثل: bac_2027).";
        return;
      }
      if (password.length < 6) {
        errEl.textContent = "كلمة السر يجب أن تكون 6 أحرف على الأقل.";
        return;
      }

      const internalEmail = toInternalEmail(cleanUser);

      try {
        if (isSignup) {
          const userRefCheck = doc(db, "usernames_v2", cleanUser);
          const taken = await getDoc(userRefCheck);
          if (taken.exists()) {
            errEl.textContent = "اسم المستخدم محجوز مسبقاً، اختر اسماً آخر.";
            return;
          }

          const cred = await createUserWithEmailAndPassword(auth, internalEmail, password);
          const stream = document.getElementById("auth-stream").value;
          const freshProfile = {
            username: cleanUser,
            stream,
            xp: 0,
            lessons: INITIAL_LESSONS
          };

          await setDoc(userRefCheck, { uid: cred.user.uid });
          await setDoc(doc(db, "users_v2", cred.user.uid), freshProfile);
          await setDoc(doc(db, "leaderboard_v2", cred.user.uid), {
            username: cleanUser,
            stream,
            xp: 0
          });
        } else {
          await signInWithEmailAndPassword(auth, internalEmail, password);
        }
      } catch (err) {
        errEl.textContent = "تعذر الدخول أو إنشاء الحساب؛ تحقق من اسم المستخدم وكلمة السر.";
      }
    };

    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (unsubLeaderboard) {
        unsubLeaderboard();
        unsubLeaderboard = null;
      }

      if (user) {
        document.getElementById("auth-screen").style.display = "none";
        document.getElementById("main-screen").style.display = "block";

        const snap = await getDoc(doc(db, "users_v2", user.uid));
        profile = snap.exists()
          ? snap.data()
          : { username: user.email.split("@")[0], stream: "علوم تجريبية", xp: 0, lessons: INITIAL_LESSONS };

        renderApp();
        subscribeLeaderboard();
      } else {
        document.getElementById("auth-screen").style.display = "block";
        document.getElementById("main-screen").style.display = "none";
      }
    });

    function subscribeLeaderboard() {
      const q = query(collection(db, "leaderboard_v2"), orderBy("xp", "desc"), limit(15));
      unsubLeaderboard = onSnapshot(q, (snapshot) => {
        const container = document.getElementById("leaderboard-container");
        container.innerHTML = "";
        let rank = 1;
        snapshot.forEach((docSnap) => {
          const item = docSnap.data();
          const row = document.createElement("div");
          row.className = "leader-row";
          row.innerHTML = `
            <div><strong>#${rank++}</strong> ${item.username} <small style="color:var(--muted);">(${item.stream || ""})</small></div>
            <strong>${item.xp} XP</strong>
          `;
          container.appendChild(row);
        });
      });
    }

    async function persistChanges() {
      renderApp();
      if (!currentUser || !profile) return;
      await setDoc(doc(db, "users_v2", currentUser.uid), profile, { merge: true });
      await setDoc(doc(db, "leaderboard_v2", currentUser.uid), {
        username: profile.username,
        stream: profile.stream,
        xp: profile.xp
      }, { merge: true });
    }

    window.updateLessonStatus = (id, status) => {
      const target = profile.lessons.find((l) => l.id === id);
      if (target) {
        target.status = status;
        persistChanges();
      }
    };

    window.completeChallenge = () => {
      const allowed = profile.lessons.filter((l) => l.status === "unlocked" || l.status === "active");
      if (!allowed.length) return;
      profile.xp += 75;
      persistChanges();
    };

    function getRankName(xp) {
      if (xp >= 1500) return "مستوى 18/20";
      if (xp >= 700) return "مرشح للامتياز";
      if (xp >= 250) return "منافس";
      return "مبتدئ";
    }

    function renderApp() {
      document.getElementById("me-username").textContent = profile.username;
      document.getElementById("me-stream").textContent = profile.stream;
      document.getElementById("me-xp").textContent = profile.xp;
      document.getElementById("me-rank").textContent = getRankName(profile.xp);

      const listEl = document.getElementById("lessons-container");
      listEl.innerHTML = "";
      profile.lessons.forEach((lesson) => {
        const cls = lesson.status === "unlocked" ? "unlocked" : (lesson.status === "active" ? "active" : "locked");
        const label = lesson.status === "unlocked" ? "مفتوح للاختبار" : (lesson.status === "active" ? "قيد الدراسة" : "مقفول");
        const row = document.createElement("div");
        row.className = "lesson";
        row.innerHTML = `
          <div>
            <div>${lesson.title}</div>
            <span class="badge ${cls}">${label}</span>
          </div>
          <select onchange="updateLessonStatus(${lesson.id}, this.value)">
            <option value="unlocked" ${lesson.status === "unlocked" ? "selected" : ""}>مفتوح للاختبار</option>
            <option value="active" ${lesson.status === "active" ? "selected" : ""}>قيد الدراسة</option>
            <option value="locked" ${lesson.status === "locked" ? "selected" : ""}>مقفول</option>
          </select>
        `;
        listEl.appendChild(row);
      });

      const allowed = profile.lessons.filter((l) => l.status === "unlocked" || l.status === "active");
      const scopeEl = document.getElementById("scope-container");
      scopeEl.innerHTML = allowed.length
        ? allowed.map((l) => `<li>${l.title}</li>`).join("")
        : "<li>لا توجد دروس مفتوحة حالياً؛ افتح درساً واحداً على الأقل لبدء التحدي.</li>";
    }
  </script>
</body>
</html>
