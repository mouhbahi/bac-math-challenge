<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAC 18 — منصة التحدي والامتياز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #07090e;
      --bg-glow-1: rgba(59, 130, 246, 0.14);
      --bg-glow-2: rgba(139, 92, 246, 0.12);
      --surface: rgba(17, 24, 39, 0.78);
      --border: rgba(255, 255, 255, 0.09);
      --border-focus: #6366f1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --accent-cyan: #06b6d4;
      --gold: #fbbf24;
    }

    * {
      box-sizing: border-box;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 15% 15%, var(--bg-glow-1), transparent 40%),
        radial-gradient(circle at 85% 80%, var(--bg-glow-2), transparent 45%);
      color: var(--text-main);
      padding: 20px 16px;
    }

    .container { max-width: 1120px; margin: 0 auto; }

    .auth-wrapper {
      min-height: calc(100vh - 40px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-box {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
    }

    .brand-badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .auth-box h2 { margin: 0 0 6px 0; font-size: 24px; font-weight: 800; }
    .auth-subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 18px; }
    .input-group { margin-bottom: 14px; }

    .input-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      background: rgba(9, 13, 22, 0.9);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }

    button {
      width: 100%;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:disabled { opacity: 0.6; cursor: not-allowed; }

    button.primary {
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: #fff;
    }

    button.ghost {
      background: transparent;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .error {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }

    .mode-note {
      font-size: 12px;
      color: var(--accent-cyan);
      margin-bottom: 12px;
    }

    header {
      background: var(--surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 22px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .hud-stats { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    .stat-pill {
      background: rgba(9, 13, 22, 0.85);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
    }

    .stat-pill strong { color: var(--accent-cyan); font-size: 15px; }

    .btn-logout {
      width: auto;
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 14px;
    }

    .rank-progress-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 20px;
      margin-bottom: 20px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: rgba(9, 13, 22, 0.9);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent-cyan));
      transition: width 0.4s ease;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
    }

    .card h3 { margin: 0 0 14px 0; font-size: 17px; font-weight: 800; }

    .lesson-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(9, 13, 22, 0.65);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .lesson-item select { width: auto; padding: 6px 10px; font-size: 12px; }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      display: inline-block;
      margin-top: 5px;
    }

    .unlocked { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; }
    .active { background: rgba(245, 158, 11, 0.18); color: #fcd34d; }
    .locked { background: rgba(148, 163, 184, 0.14); color: #94a3b8; }

    .scope-list { margin: 10px 0 0 0; padding-right: 18px; font-size: 14px; line-height: 1.8; }

    .leader-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 14px;
      border-radius: 12px;
      background: rgba(9, 13, 22, 0.7);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      font-size: 14px;
    }

    .leader-row.top-1 {
      border-color: rgba(251, 191, 36, 0.45);
      background: linear-gradient(90deg, rgba(251, 191, 36, 0.12), rgba(9, 13, 22, 0.75));
    }

    .rank-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      font-weight: 800;
      font-size: 12px;
      margin-left: 8px;
    }

    .top-1 .rank-num { background: var(--gold); color: #000; }
  </style>
</head>
<body>

  <div id="auth-screen" class="auth-wrapper">
    <div class="auth-box">
      <span class="brand-badge">BAC 2027 • EDITION</span>
      <h2 id="auth-heading">تسجيل الدخول</h2>
      <div class="auth-subtitle" id="auth-sub">ادخل باسم المستخدم وكلمة السر</div>
      <div class="mode-note" id="mode-indicator"></div>

      <div id="auth-error" class="error"></div>

      <div class="input-group">
        <label>اسم المستخدم</label>
        <input type="text" id="auth-username" placeholder="اكتب اسمك أو لقبك..." />
      </div>

      <div class="input-group">
        <label>كلمة السر</label>
        <input type="password" id="auth-password" placeholder="أي كلمة سر تريدها..." />
      </div>

      <div class="input-group" id="stream-group" style="display:none;">
        <label>الشعبة الدراسية</label>
        <select id="auth-stream">
          <option value="علوم تجريبية">شعبة العلوم التجريبية</option>
          <option value="رياضيات">شعبة الرياضيات</option>
          <option value="تقني رياضي">شعبة تقني رياضي</option>
        </select>
      </div>

      <button type="button" class="primary" id="auth-submit">دخول إلى المنصة</button>
      <button type="button" class="ghost" id="auth-switch">ليس لديك حساب؟ أنشئ حساباً الآن</button>
    </div>
  </div>

  <div id="main-screen" class="container" style="display:none;">
    <header>
      <div>
        <h2 style="margin:0;">أهلاً، <span id="me-username"></span></h2>
        <small style="color:var(--text-muted);">الشعبة: <span id="me-stream"></span></small>
      </div>
      <div class="hud-stats">
        <div class="stat-pill">الخبرة: <strong id="me-xp">0</strong> XP</div>
        <div class="stat-pill">الرتبة: <strong id="me-rank">مبتدئ</strong></div>
        <button type="button" class="btn-logout" id="logout-btn">تسجيل خروج</button>
      </div>
    </header>

    <div class="rank-progress-card">
      <div class="progress-header">
        <span>التقدم نحو الرتبة القادمة</span>
        <span id="xp-next-label">0 / 250 XP</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="xp-bar"></div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>مسار الدروس (الرياضيات)</h3>
        <div id="lessons-container"></div>
      </div>

      <div class="card">
        <h3>نطاق الاختبار والتحدي</h3>
        <p style="color:var(--text-muted); margin:0 0 8px 0; font-size:13px;">
          النظام يختبرك فقط في الدروس المفتوحة أو قيد الدراسة:
        </p>
        <ul id="scope-container" class="scope-list"></ul>
        <button type="button" class="primary" style="margin-top:18px;" id="challenge-btn">
          إتمام تحدي الدروس المفتوحة (+75 XP)
        </button>
      </div>

      <div class="card">
        <h3>لوحة المتصدرين</h3>
        <div id="leaderboard-container"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_NEW_API_KEY",
      authDomain: "YOUR_NEW_PROJECT.firebaseapp.com",
      projectId: "YOUR_NEW_PROJECT_ID",
      storageBucket: "YOUR_NEW_PROJECT.appspot.com",
      messagingSenderId: "YOUR_NEW_SENDER_ID",
      appId: "YOUR_NEW_APP_ID"
    };

    const hasRealFirebase = !String(firebaseConfig.apiKey || "").includes("YOUR_NEW_");
    let auth = null;
    let db = null;

    if (hasRealFirebase) {
      try {
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
      } catch (e) {
        console.error("Firebase init error:", e);
      }
    }

    const INITIAL_LESSONS = [
      { id: 1, title: "الدوال العددية (نهايات، اشتقاق، مناقشة)", status: "unlocked" },
      { id: 2, title: "المتتاليات العددية", status: "active" },
      { id: 3, title: "الأعداد المركبة", status: "locked" },
      { id: 4, title: "الدوال الأصلية والتكامل", status: "locked" },
      { id: 5, title: "الاحتمالات", status: "locked" }
    ];

    let isSignup = false;
    let currentUser = null;
    let profile = null;
    let unsubLeaderboard = null;

    const modeNoteEl = document.getElementById("mode-indicator");
    modeNoteEl.textContent = hasRealFirebase && auth && db
      ? "وضع السحابة مفعّل (Firebase)"
      : "وضع التجربة الفورية المحلي — يعمل فوراً حتى تضيف مفاتيح Firebase";

    function encodeUserKey(raw) {
      const trimmed = raw.trim().toLowerCase();
      const hex = Array.from(new TextEncoder().encode(trimmed))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
      return hex || "user";
    }

    function normalizeAuthPassword(rawPass) {
      return rawPass.length >= 6 ? rawPass : rawPass + "__bac18_pad";
    }

    function showError(msg) {
      const el = document.getElementById("auth-error");
      if (!msg) {
        el.style.display = "none";
        el.textContent = "";
      } else {
        el.style.display = "block";
        el.textContent = msg;
      }
    }

    function getLocalAccounts() {
      return JSON.parse(localStorage.getItem("bac18_local_accounts_v2") || "{}");
    }

    function saveLocalAccounts(accounts) {
      localStorage.setItem("bac18_local_accounts_v2", JSON.stringify(accounts));
    }

    function enterMainScreen(userObj, profileData) {
      currentUser = userObj;
      profile = profileData;
      document.getElementById("auth-screen").style.display = "none";
      document.getElementById("main-screen").style.display = "block";
      renderApp();
      renderLocalLeaderboard();
    }

    function renderLocalLeaderboard() {
      const accounts = getLocalAccounts();
      const list = Object.values(accounts)
        .map(acc => ({
          username: acc.profile.username,
          stream: acc.profile.stream,
          xp: acc.profile.xp || 0
        }))
        .sort((a, b) => b.xp - a.xp)
        .slice(0, 15);

      const container = document.getElementById("leaderboard-container");
      container.innerHTML = "";
      list.forEach((item, idx) => {
        const rank = idx + 1;
        const row = document.createElement("div");
        row.className = "leader-row" + (rank === 1 ? " top-1" : "");
        row.innerHTML = `
          <div>
            <span class="rank-num">${rank}</span>
            <strong>${item.username}</strong>
            <small style="color:var(--text-muted); margin-right:6px;">${item.stream || ""}</small>
          </div>
          <strong style="color:var(--accent-cyan);">${item.xp} XP</strong>
        `;
        container.appendChild(row);
      });
    }

    function handleLocalAuth(displayUsername, rawPassword, stream) {
      const key = encodeUserKey(displayUsername);
      const accounts = getLocalAccounts();

      if (isSignup) {
        if (accounts[key]) {
          showError("اسم المستخدم مستعمل مسبقاً في هذا المتصفح.");
          return;
        }
        const freshProfile = {
          username: displayUsername,
          stream: stream || "علوم تجريبية",
          xp: 0,
          lessons: JSON.parse(JSON.stringify(INITIAL_LESSONS))
        };
        accounts[key] = { password: rawPassword, profile: freshProfile };
        saveLocalAccounts(accounts);
        localStorage.setItem("bac18_active_user_v2", key);
        enterMainScreen({ uid: key, isLocal: true }, freshProfile);
      } else {
        const existing = accounts[key];
        if (!existing || existing.password !== rawPassword) {
          showError("اسم المستخدم أو كلمة السر غير صحيحة.");
          return;
        }
        localStorage.setItem("bac18_active_user_v2", key);
        enterMainScreen({ uid: key, isLocal: true }, existing.profile);
      }
    }

    document.getElementById("auth-switch").addEventListener("click", () => {
      isSignup = !isSignup;
      showError("");
      document.getElementById("auth-heading").textContent = isSignup ? "إنشاء حساب جديد" : "تسجيل الدخول";
      document.getElementById("auth-sub").textContent = isSignup
        ? "اختر اسم مستخدم وأي كلمة سر للبدء"
        : "ادخل باسم المستخدم وكلمة السر التي اخترتها";
      document.getElementById("stream-group").style.display = isSignup ? "block" : "none";
      document.getElementById("auth-submit").textContent = isSignup ? "إنشاء الحساب والدخول" : "دخول إلى المنصة";
      document.getElementById("auth-switch").textContent = isSignup
        ? "لديك حساب بالفعل؟ سجّل الدخول"
        : "ليس لديك حساب؟ أنشئ حساباً الآن";
    });

    document.getElementById("auth-submit").addEventListener("click", async () => {
      showError("");
      const submitBtn = document.getElementById("auth-submit");
      const displayUsername = document.getElementById("auth-username").value.trim();
      const rawPassword = document.getElementById("auth-password").value;
      const stream = document.getElementById("auth-stream").value;

      if (!displayUsername) {
        showError("يرجى كتابة اسم المستخدم.");
        return;
      }
      if (!rawPassword) {
        showError("يرجى كتابة كلمة السر.");
        return;
      }

      submitBtn.disabled = true;
      try {
        if (!hasRealFirebase || !auth || !db) {
          handleLocalAuth(displayUsername, rawPassword, stream);
          return;
        }

        const userKey = encodeUserKey(displayUsername);
        const internalEmail = `u_${userKey}@bac18.app`;
        const authPass = normalizeAuthPassword(rawPassword);

        if (isSignup) {
          const checkRef = doc(db, "usernames_v2", userKey);
          const snap = await getDoc(checkRef);
          if (snap.exists()) {
            showError("اسم المستخدم مستعمل مسبقاً، اختر اسماً آخر.");
            return;
          }

          const cred = await createUserWithEmailAndPassword(auth, internalEmail, authPass);
          const freshProfile = {
            username: displayUsername,
            stream,
            xp: 0,
            lessons: INITIAL_LESSONS
          };

          await setDoc(checkRef, { uid: cred.user.uid, username: displayUsername });
          await setDoc(doc(db, "users_v2", cred.user.uid), freshProfile);
          await setDoc(doc(db, "leaderboard_v2", cred.user.uid), {
            username: displayUsername,
            stream,
            xp: 0
          });
        } else {
          await signInWithEmailAndPassword(auth, internalEmail, authPass);
        }
      } catch (err) {
        const code = err?.code || "";
        if (code.includes("email-already-in-use")) {
          showError("اسم المستخدم مسجل مسبقاً.");
        } else if (code.includes("invalid-credential") || code.includes("user-not-found") || code.includes("wrong-password")) {
          showError("اسم المستخدم أو كلمة السر غير صحيحة.");
        } else {
          showError("تعذر الاتصال بالخادم؛ تأكد من إعدادات Firebase وتفعيل Email/Password.");
        }
      } finally {
        submitBtn.disabled = false;
      }
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {
      if (hasRealFirebase && auth && currentUser && !currentUser.isLocal) {
        await signOut(auth);
      } else {
        localStorage.removeItem("bac18_active_user_v2");
        currentUser = null;
        profile = null;
        document.getElementById("auth-screen").style.display = "flex";
        document.getElementById("main-screen").style.display = "none";
      }
    });

    document.getElementById("challenge-btn").addEventListener("click", () => {
      const allowed = profile.lessons.filter((l) => l.status === "unlocked" || l.status === "active");
      if (!allowed.length) return;
      profile.xp = (profile.xp || 0) + 75;
      persistChanges();
    });

    function subscribeLeaderboard() {
      if (!hasRealFirebase || !db) return;
      const q = query(collection(db, "leaderboard_v2"), orderBy("xp", "desc"), limit(15));
      unsubLeaderboard = onSnapshot(q, (snapshot) => {
        const container = document.getElementById("leaderboard-container");
        container.innerHTML = "";
        let rank = 1;
        snapshot.forEach((docSnap) => {
          const item = docSnap.data();
          const row = document.createElement("div");
          row.className = "leader-row" + (rank === 1 ? " top-1" : "");
          row.innerHTML = `
            <div>
              <span class="rank-num">${rank++}</span>
              <strong>${item.username}</strong>
              <small style="color:var(--text-muted); margin-right:6px;">${item.stream || ""}</small>
            </div>
            <strong style="color:var(--accent-cyan);">${item.xp} XP</strong>
          `;
          container.appendChild(row);
        });
      });
    }

    async function persistChanges() {
      renderApp();
      if (!currentUser || !profile) return;

      if (currentUser.isLocal || !hasRealFirebase || !db) {
        const accounts = getLocalAccounts();
        accounts[currentUser.uid] = {
          ...(accounts[currentUser.uid] || {}),
          profile
        };
        saveLocalAccounts(accounts);
        renderLocalLeaderboard();
        return;
      }

      await setDoc(doc(db, "users_v2", currentUser.uid), profile, { merge: true });
      await setDoc(doc(db, "leaderboard_v2", currentUser.uid), {
        username: profile.username,
        stream: profile.stream,
        xp: profile.xp
      }, { merge: true });
    }

    function getRankInfo(xp) {
      if (xp >= 1500) return { name: "مستوى 18/20", next: 2500, prev: 1500 };
      if (xp >= 700) return { name: "مرشح للامتياز", next: 1500, prev: 700 };
      if (xp >= 250) return { name: "منافس", next: 700, prev: 250 };
      return { name: "مبتدئ", next: 250, prev: 0 };
    }

    function renderApp() {
      const xpVal = profile.xp || 0;
      const rankInfo = getRankInfo(xpVal);
      document.getElementById("me-username").textContent = profile.username;
      document.getElementById("me-stream").textContent = profile.stream;
      document.getElementById("me-xp").textContent = xpVal;
      document.getElementById("me-rank").textContent = rankInfo.name;

      const pct = Math.min(100, Math.max(0, Math.round(((xpVal - rankInfo.prev) / (rankInfo.next - rankInfo.prev)) * 100)));
      document.getElementById("xp-bar").style.width = `${pct}%`;
      document.getElementById("xp-next-label").textContent = `${xpVal} / ${rankInfo.next} XP`;

      const listEl = document.getElementById("lessons-container");
      listEl.innerHTML = "";
      profile.lessons.forEach((lesson) => {
        const cls = lesson.status === "unlocked" ? "unlocked" : (lesson.status === "active" ? "active" : "locked");
        const label = lesson.status === "unlocked" ? "مفتوح للاختبار" : (lesson.status === "active" ? "قيد الدراسة" : "مقفول");
        const row = document.createElement("div");
        row.className = "lesson-item";

        const infoDiv = document.createElement("div");
        infoDiv.innerHTML = `<div style="font-size:14px; font-weight:600;">${lesson.title}</div><span class="badge ${cls}">${label}</span>`;

        const selectEl = document.createElement("select");
        [
          ["unlocked", "مفتوح للاختبار"],
          ["active", "قيد الدراسة"],
          ["locked", "مقفول"]
        ].forEach(([val, txt]) => {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = txt;
          if (lesson.status === val) opt.selected = true;
          selectEl.appendChild(opt);
        });

        selectEl.addEventListener("change", (e) => {
          lesson.status = e.target.value;
          persistChanges();
        });

        row.appendChild(infoDiv);
        row.appendChild(selectEl);
        listEl.appendChild(row);
      });

      const allowed = profile.lessons.filter((l) => l.status === "unlocked" || l.status === "active");
      const scopeEl = document.getElementById("scope-container");
      scopeEl.innerHTML = allowed.length
        ? allowed.map((l) => `<li>${l.title}</li>`).join("")
        : "<li>لا توجد دروس مفتوحة حالياً؛ افتح درساً واحداً على الأقل.</li>";
    }

    if (hasRealFirebase && auth && db) {
      onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        if (unsubLeaderboard) {
          unsubLeaderboard();
          unsubLeaderboard = null;
        }

        if (user) {
          document.getElementById("auth-screen").style.display = "none";
          document.getElementById("main-screen").style.display = "block";

          const snap = await getDoc(doc(db, "users_v2", user.uid));
          profile = snap.exists()
            ? snap.data()
            : { username: "طالب", stream: "علوم تجريبية", xp: 0, lessons: INITIAL_LESSONS };

          renderApp();
          subscribeLeaderboard();
        } else {
          document.getElementById("auth-screen").style.display = "flex";
          document.getElementById("main-screen").style.display = "none";
        }
      });
    } else {
      const savedKey = localStorage.getItem("bac18_active_user_v2");
      const accounts = getLocalAccounts();
      if (savedKey && accounts[savedKey]) {
        enterMainScreen({ uid: savedKey, isLocal: true }, accounts[savedKey].profile);
      }
    }
  </script>
</body>
</html>
