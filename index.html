<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="default">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحدي مواضيع البكالوريا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1424;--panel:#161d33;--line:#27304d;--ink:#eef1fa;--mute:#8e98b8;--pen:#ff5a4d;--ok:#3ddc97;--on:#111;--r:14px;--sh:none;--vg:1;--btn:var(--pen);
--bgimg:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);--bgsz:28px 28px;--deco:"📐 ✏️ 📚 🧪"}
[data-theme=purple]{--bg:#1a0b2e;--panel:#2a1450aa;--line:#5b32a3;--ink:#f6ecff;--mute:#c4a8ee;--pen:#c084fc;--on:#fff;--r:28px;--sh:0 0 28px #c084fc40;--vg:.3;--btn:linear-gradient(135deg,#a855f7,#ec4899);
--bgimg:radial-gradient(circle at 15% 10%,#7c3aed66,transparent 45%),radial-gradient(circle at 85% 85%,#ec489966,transparent 45%);--bgsz:auto;--deco:"🔮 ✨ 🌙 💫"}
[data-theme=blue]{--bg:#e8f4ff;--panel:#ffffff;--line:#cde4f7;--ink:#0b2540;--mute:#5b7a99;--pen:#0a84ff;--ok:#12a36b;--on:#fff;--r:20px;--sh:0 10px 28px #0a84ff22;--vg:0;
--bgimg:radial-gradient(circle at 85% 0,#9fd3ff99,transparent 50%),linear-gradient(180deg,#d6ecff,#eef7ff);--bgsz:auto;--deco:"🌊 🐬 🫧 ⛵"}
[data-theme=gold]{--bg:#0b0b0b;--panel:#17140c;--line:#6b5416;--ink:#f6e7b8;--mute:#b09a62;--pen:#e8b923;--on:#1a1400;--r:3px;--sh:inset 0 0 0 5px #17140c,inset 0 0 0 6px #6b541677;--vg:.6;
--bgimg:repeating-linear-gradient(45deg,#ffffff07 0 2px,transparent 2px 14px);--bgsz:auto;--deco:"👑 🏅 ⭐ 💎"}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,system-ui,sans-serif;background-color:var(--bg);background-image:var(--bgimg);background-size:var(--bgsz);background-attachment:fixed;color:var(--ink);min-height:100vh;transition:background-color .4s,color .4s}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 0,transparent,var(--bg) 75%);opacity:var(--vg);pointer-events:none}
body::after{content:var(--deco);position:fixed;bottom:10px;left:14px;font-size:1.8rem;letter-spacing:12px;opacity:.28;pointer-events:none}
#app{position:relative;max-width:980px;margin:auto;padding:16px 14px 90px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:1.25rem;font-weight:800}h2{font-size:1.05rem;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh);transition:transform .2s}
.card:hover{transform:translateY(-2px)}
[data-theme=purple] .card,[data-theme=purple] .modal>div{backdrop-filter:blur(10px)}
label{display:block;font-size:.82rem;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:calc(var(--r)*.7);padding:10px;font:inherit}
[data-theme=blue] input,[data-theme=blue] select,[data-theme=blue] textarea{background:#f3f9ff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pen);outline-offset:1px}
.btn{background:var(--btn);color:var(--on);border:0;border-radius:calc(var(--r)*.7);padding:10px 16px;font:inherit;font-weight:800;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.96)}
[data-theme=blue] .btn{border-radius:99px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.red{background:#e5484d;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
nav button{flex:1;white-space:nowrap;background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:calc(var(--r)*.7);padding:9px 12px;font:inherit;cursor:pointer}
nav button.on{color:var(--on);background:var(--btn);border-color:var(--pen);font-weight:800}
[data-theme=purple] nav button,[data-theme=blue] nav button{border-radius:99px}
[data-theme=blue] nav{background:#fff;padding:5px;border-radius:99px;box-shadow:var(--sh)}[data-theme=blue] nav button{border:0;background:transparent}[data-theme=blue] nav button.on{background:var(--pen)}
[data-theme=gold] nav{border-bottom:1px solid var(--line)}[data-theme=gold] nav button{background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0}[data-theme=gold] nav button.on{background:transparent;color:var(--pen);border-bottom-color:var(--pen)}
[data-theme=blue] header,[data-theme=gold] header{flex-direction:column;text-align:center}
[data-theme=gold] header{border-bottom:3px double var(--pen);padding-bottom:12px}[data-theme=gold] h1{letter-spacing:1px}
.tag{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mute);margin:2px 0 2px 4px}
.stamp{display:inline-grid;place-items:center;width:120px;height:120px;border:4px solid var(--pen);border-radius:50%;color:var(--pen);font-weight:800;font-size:2rem;transform:rotate(-8deg)}
[data-theme=purple] .stamp{box-shadow:0 0 30px var(--pen),inset 0 0 20px #c084fc55}[data-theme=blue] .stamp{background:var(--pen);color:#fff;border-color:#fff;box-shadow:0 8px 24px #0a84ff55}[data-theme=gold] .stamp{border-style:double;border-width:7px;border-radius:8px}
.hero{text-align:center;padding:26px 8px}.hero p{color:var(--mute);margin-top:6px}.emo{font-size:1.8rem;letter-spacing:10px;margin-top:10px}
.bar{height:9px;background:var(--bg);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--btn);transition:width .6s}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.thumbs img{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;margin:6px 0 0 6px}
.dots{display:inline-flex;gap:4px}.dots b{width:16px;height:16px;border-radius:5px;border:1px solid var(--line)}.dots b.on{background:var(--ok);border-color:var(--ok)}
.yr{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.rank{min-width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:800;font-size:1.2rem;flex:none}
.top1{background:var(--btn);color:var(--on)}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:14px;z-index:9}
.modal>div{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--sh)}
.modal img.big{width:100%;border-radius:10px;margin-top:8px}
pre{white-space:pre-wrap;font:inherit;line-height:1.9}
.warn{color:var(--pen);font-size:.85rem;margin-top:8px}.mute{color:var(--mute);font-size:.85rem}
.themes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.themes button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font:inherit;font-size:.82rem;cursor:pointer}
.themes button.on{background:var(--btn);color:var(--on);border-color:var(--pen);font-weight:800}
.fall{position:fixed;top:-40px;z-index:20;pointer-events:none}
@media(prefers-reduced-motion:no-preference){.modal>div{animation:pop .2s ease-out}@keyframes pop{from{transform:scale(.94);opacity:0}}
.stamp{animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}@keyframes stamp{from{transform:rotate(-8deg) scale(2);opacity:0}}
.fall{animation:fall 2.8s ease-in forwards}@keyframes fall{to{transform:translateY(112vh) rotate(420deg)}}
body::after{animation:bob 4s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-10px)}}}
@media(prefers-reduced-motion:reduce){.fall{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,onSnapshot,query,orderBy,doc,updateDoc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== ضع هنا نفس إعدادات Firebase القديمة لتبقى كل البيانات القديمة ===== */
const FIREBASE_CONFIG={apiKey:"PASTE_HERE",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""};
const KEYS_COL="apiKeys";      // غيّر الاسم ليطابق مجموعة مفاتيح Gemini القديمة
const ADMIN_CODE="1234";       // نفس الرمز القديم (يُفضّل تغييره)
const GEMINI_MODEL="gemini-2.5-flash";

const db=getFirestore(initializeApp(FIREBASE_CONFIG));
const SUB=collection(db,"submissions");
const SUBJECTS={
 "الرياضيات":{cats:["الدوال","المتتاليات العددية","الأعداد المركبة","الهندسة في الفضاء / الاحتمالات"],ts:["علوم تجريبية","رياضيات","تقني رياضي"],ico:"📐"},
 "العلوم الفيزيائية":{cats:["التمرين الأول","التمرين الثاني","التمرين الثالث"],ts:["علوم تجريبية","رياضيات وتقني رياضي"],ico:"⚡"},
 "العلوم الطبيعية":{cats:["استرجاع المعارف","استدلال علمي","مسعى علمي"],ts:["علوم تجريبية"],ico:"🧬"}};
const TOPICS=["الموضوع الأول","الموضوع الثاني"],STREAMS=["علوم تجريبية","رياضيات / تقني رياضي"];
const YEARS=Array.from({length:18},(_,i)=>2026-i);

const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let me=JSON.parse(localStorage.getItem("bac_user")||"null"),tab="send",ALL=[],KEYS=[],lb="الكل",mapSub="الرياضيات",mapStr="علوم تجريبية";
document.documentElement.dataset.theme=localStorage.getItem("bac_theme")||"default";

const graded=s=>s.status!=="pending"&&typeof s.score==="number";
const fmt=t=>t?.toDate?t.toDate().toLocaleString("ar-DZ",{dateStyle:"medium",timeStyle:"short"}):"الآن";
const mine=()=>ALL.filter(s=>s.studentName===me.name);
const sameEx=(a,b)=>["subject","topic","topicStream","category","year"].every(k=>String(a[k])===String(b[k]));

onSnapshot(query(SUB,orderBy("timestamp","desc")),q=>{ALL=q.docs.map(d=>({id:d.id,...d.data()}));if(me&&tab!=="send"&&!$(".modal"))show()});
onSnapshot(collection(db,KEYS_COL),q=>{KEYS=q.docs.map(d=>({id:d.id,...d.data()}));if(me?.role==="admin"&&tab==="keys")show()},()=>{});

function modal(html){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div>${html}<button class="btn ghost" style="margin-top:14px;width:100%" data-x>إغلاق</button></div>`;
 m.onclick=e=>{if(e.target===m||e.target.dataset.x!==undefined)m.remove()};document.body.append(m)}
const head=()=>`<header><div><h1>🎓 تحدي مواضيع البكالوريا</h1><span class="mute">${me?esc(me.name)+" · "+esc(me.stream||"مشرف"):"تصحيح ذكي ومتابعة شاملة"}</span></div>
<div class="themes">${[["default","🌙","ليلي"],["purple","🔮","سحري"],["blue","🌊","محيط"],["gold","👑","ملكي"]].map(([t,e,n])=>`<button data-th="${t}" class="${document.documentElement.dataset.theme===t?"on":""}">${e} ${n}</button>`).join("")}${me?`<button id="out">🚪 خروج</button>`:""}</div></header>`;
function wire(){document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{localStorage.setItem("bac_theme",b.dataset.th);document.documentElement.dataset.theme=b.dataset.th;document.querySelectorAll("[data-th]").forEach(x=>x.classList.toggle("on",x===b));burst(b.dataset.th)});
 const o=$("#out");if(o)o.onclick=()=>{localStorage.removeItem("bac_user");me=null;show()}}

function show(){app.innerHTML=head()+(!me?loginV():me.role==="admin"?adminV():studentV());wire();(!me?wireLogin:me.role==="admin"?wireAdmin:wireStudent)()}
const tabs=(list)=>`<nav>${list.map(([k,t])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${t}</button>`).join("")}</nav>`;
const wireTabs=()=>document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;show()});

/* ---------- الدخول ---------- */
function loginV(){return`<div class="hero"><div class="stamp">10/10</div><div class="emo">📐 ⚡ 🧬 🎯</div><h1 style="font-size:1.6rem;margin-top:14px">أرسل حلّك، واعرف خطأك فوراً</h1><p>صوّر كراسك، يصحّحه الذكاء الاصطناعي، وتنافس مع زملائك.</p></div>
<div class="card" style="max-width:440px;margin:auto"><div class="row"><button class="btn" id="rS">🧑‍🎓 متنافس</button><button class="btn ghost" id="rA">🛡️ مشرف</button></div>
<div id="fS"><label>اسمك المستعار</label><input id="nm" maxlength="24"><label>شعبتك الأصلية</label><select id="st">${STREAMS.map(s=>`<option>${s}</option>`).join("")}</select></div>
<div id="fA" hidden><label>رمز المشرف</label><input id="cd" type="password"></div><button class="btn" id="go" style="width:100%;margin-top:16px">🚀 دخول</button><div class="warn" id="er"></div></div>`}
function wireLogin(){let role="student";const set=r=>{role=r;$("#fS").hidden=r!=="student";$("#fA").hidden=r!=="admin";$("#rS").className="btn"+(r==="student"?"":" ghost");$("#rA").className="btn"+(r==="admin"?"":" ghost")};
 $("#rS").onclick=()=>set("student");$("#rA").onclick=()=>set("admin");
 $("#go").onclick=()=>{if(role==="admin"){if($("#cd").value!==ADMIN_CODE)return $("#er").textContent="الرمز غير صحيح";me={role:"admin",name:"المشرف"};tab="reviews"}
  else{const n=$("#nm").value.trim();if(!n)return $("#er").textContent="اكتب اسمك المستعار";me={role:"student",name:n,stream:$("#st").value};tab="send";mapStr=me.stream==="علوم تجريبية"?"علوم تجريبية":"رياضيات"}
  localStorage.setItem("bac_user",JSON.stringify(me));show()}}

/* ---------- الطالب ---------- */
function studentV(){const pts=mine().filter(graded).reduce((a,s)=>a+s.score,0);
 return`<div class="card item"><b>✨ ${pts} نقطة · ${lvl(pts)}</b><span class="mute">✅ ${mine().filter(graded).length} تمرين مكتمل</span></div>`+tabs([["send","📤 إرسال حل"],["mine","📂 حلولي"],["board","🏆 الترتيب"],["map","🗺️ خريطتي"]])+`<div id="v">${{send:sendV,mine:mineV,board:boardV,map:mapV}[tab]()}</div>`}
const opts=(a,sel)=>a.map(x=>`<option ${x==sel?"selected":""}>${x}</option>`).join("");
function sendV(){const subs=Object.keys(SUBJECTS).filter(s=>s!=="العلوم الطبيعية"||me.stream==="علوم تجريبية");
 return`<div class="card"><h2>إرسال حل تمرين</h2><div class="row"><div><label>المادة</label><select id="sj">${opts(subs)}</select></div><div><label>شعبة الموضوع</label><select id="ts"></select></div></div>
<div class="row"><div><label>الموضوع</label><select id="tp">${opts(TOPICS)}</select></div><div><label>المحور / التمرين</label><select id="ct"></select></div><div><label>الدورة</label><select id="yr">${opts(YEARS)}</select></div></div>
<label>ملاحظة للذكاء الاصطناعي (الأسئلة التي لم تدرسها بعد، حتى لا تُخصم)</label><textarea id="nt" rows="2"></textarea>
<label>صور الحل من كراسك (يمكن اختيار عدة صور)</label><input id="im" type="file" accept="image/*" multiple><div id="pv" class="thumbs"></div>
<div class="warn" id="dup" hidden>⚠️ سبق أن أرسلت هذا التمرين.</div><button class="btn" id="sd" style="width:100%;margin-top:14px">إرسال للتصحيح 🤖</button><div class="mute" id="stt" style="margin-top:8px"></div></div>`}
const cur=()=>({subject:$("#sj").value,topic:$("#tp").value,topicStream:$("#ts").value,category:$("#ct").value,year:+$("#yr").value});
function wireStudent(){wireTabs();if(tab!=="send")return wireLists();
 const fill=()=>{const s=SUBJECTS[$("#sj").value];$("#ts").innerHTML=opts(s.ts,me.stream==="علوم تجريبية"?"علوم تجريبية":s.ts[1]);$("#ct").innerHTML=opts(s.cats);chk()};
 const chk=()=>{const d=mine().some(s=>sameEx(s,cur()));$("#dup").hidden=!d;$("#sd").disabled=d};
 ["sj"].forEach(i=>$("#"+i).onchange=fill);["ts","tp","ct","yr"].forEach(i=>$("#"+i).onchange=chk);fill();
 $("#im").onchange=e=>{$("#pv").innerHTML=[...e.target.files].map(f=>`<img src="${URL.createObjectURL(f)}">`).join("")};
 $("#sd").onclick=async()=>{const files=[...$("#im").files];if(!files.length)return $("#stt").textContent="اختر صورة واحدة على الأقل";
  $("#sd").disabled=true;try{$("#stt").textContent="جارٍ ضغط الصور…";const images=await compress(files);
  const meta={...cur(),studentName:me.name,studentStream:me.stream,images,studentNote:$("#nt").value.trim(),hideForStudent:false,timestamp:serverTimestamp()};
  $("#stt").textContent="الذكاء الاصطناعي يصحّح حلّك…";let r;try{r=await grade(meta)}catch(e){r=null}
  await addDoc(SUB,r?{...meta,status:"graded",score:r.score,adminNote:r.details}:{...meta,status:"pending",score:0,adminNote:""});
  $("#stt").textContent="";if(r&&r.score>=8)rain(["🎉","🏆","⭐","🔥","🎓"]);r?modal(`<div style="text-align:center"><div class="stamp">${r.score}/10</div></div><h2 style="margin-top:14px">${r.score>=8?"🎉 ممتاز! ":r.score>=5?"💪 تقدّم جيد! ":"📚 راجع أخطاءك! "}نتيجة التصحيح</h2><pre>${esc(r.details)}</pre><p class="mute">الذكاء الاصطناعي قد يخطئ، راجع الحل مع أستاذك.</p>`):modal(`<h2>📨 تم الإرسال</h2><p>تعذّر التصحيح الآلي الآن، وسيراجع المشرف حلّك.</p>`);
  $("#im").value="";$("#pv").innerHTML=""}catch(e){$("#stt").textContent="حدث خطأ: "+e.message}chk()}}

/* ضغط الصور حتى لا يتجاوز المستند 1MB في Firestore */
async function compress(files){const n=files.length,[dim,q,gray]=n<=2?[1400,.72,0]:n<=4?[1100,.6,0]:n<=6?[900,.5,1]:[750,.42,1];
 const one=(f,dm,qq)=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,dm/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;
  const x=c.getContext("2d");if(gray)x.filter="grayscale(1) contrast(1.25)";x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",qq))};im.onerror=no;im.src=URL.createObjectURL(f)});
 let dm=dim,qq=q,out;for(let t=0;t<5;t++){out=await Promise.all(files.map(f=>one(f,dm,qq)));if(out.join("").length<880000)return out;dm*=.8;qq*=.85}
 throw new Error("حجم الصور كبير جداً، قلّل عدد الأوراق")}

async function grade(m){const keys=[...KEYS].sort(()=>Math.random()-.5);if(!keys.length)return null;
 const prompt=`أنت أستاذ بكالوريا جزائري. صحّح حل الطالب (شعبة ${m.studentStream}) للمادة ${m.subject}، ${m.topic} ${m.topicStream}، المحور: ${m.category}، دورة ${m.year}.
${m.studentNote?"ملاحظة الطالب (أسئلة لم يدرسها فلا تخصم عليها): "+m.studentNote:""}
أجب بـ JSON فقط بلا أي نص آخر: {"score": عدد من 0 إلى 10, "details": "العلامة الفعلية على 20 أو على سلم التمرين، ثم الأخطاء بالتفصيل بالعربية"}`;
 const parts=[{text:prompt},...m.images.map(d=>({inline_data:{mime_type:"image/jpeg",data:d.split(",")[1]}}))];
 for(const k of keys){try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${k.key}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:"application/json"}})});
  if(!r.ok)continue;const j=await r.json(),t=j.candidates[0].content.parts.map(p=>p.text||"").join("").replace(/```json|```/g,"").trim(),o=JSON.parse(t);
  return{score:Math.max(0,Math.min(10,Math.round(+o.score))),details:String(o.details)}}catch(e){}}return null}

/* ---------- القوائم ---------- */
const thumbs=s=>`<div class="thumbs">${(s.images||[]).map((u,i)=>`<img src="${u}" data-id="${s.id}" data-i="${i}">`).join("")}</div>`;
const tags=s=>`<span class="tag">${SUBJECTS[s.subject]?.ico||"📘"} ${esc(s.subject)}</span><span class="tag">${esc(s.topic)}</span><span class="tag">${esc(s.category)}</span><span class="tag">${esc(s.year)}</span>`;
const stat=s=>graded(s)?`<b style="color:var(--ok)">${s.score}/10</b>`:`<span class="tag">بانتظار المراجعة</span>`;
function mineV(){const l=mine().filter(s=>!s.hideForStudent);return l.length?l.map(s=>`<div class="card"><div class="item"><div>${tags(s)}</div>${stat(s)}</div><div class="mute">${fmt(s.timestamp)}</div>${thumbs(s)}
<div class="row" style="margin-top:10px"><button class="btn sm" data-det="${s.id}">تفاصيل الأخطاء</button><button class="btn ghost sm" data-hide="${s.id}">إخفاء</button></div></div>`).join(""):`<div class="card mute">📭 لا توجد حلول بعد. أرسل أول تمرين من تبويب «إرسال حل».</div>`}
function boardV(){const g={};ALL.filter(graded).filter(s=>lb==="الكل"||s.subject===lb).forEach(s=>{(g[s.studentName]??={n:s.studentName,p:0,c:0,st:s.studentStream}).p+=s.score;g[s.studentName].c++});
 const L=Object.values(g).sort((a,b)=>b.p-a.p),mx=L[0]?.p||1;
 return`<nav>${["الكل",...Object.keys(SUBJECTS)].map(s=>`<button data-lb="${s}" class="${lb===s?"on":""}">${s}</button>`).join("")}</nav>`+(L.length?L.map((u,i)=>`<div class="card"><div class="item"><div class="item" style="justify-content:flex-start"><span class="rank ${i?"":"top1"}">${["🥇","🥈","🥉"][i]||i+1}</span><div><b>${esc(u.n)}${u.n===me.name?" (أنت)":""}</b><div class="mute">${esc(u.st)} · ${u.c} تمرين</div></div></div><b>⭐ ${u.p} نقطة</b></div><div class="bar" style="margin-top:10px"><i style="width:${u.p/mx*100}%"></i></div></div>`).join(""):`<div class="card mute">🏁 لا نتائج في هذه المادة بعد.</div>`)}
function mapV(){const S=SUBJECTS[mapSub],ts=S.ts.includes(mapStr)?mapStr:S.ts[S.ts.length-1],M=mine().filter(graded).filter(s=>s.subject===mapSub&&s.topicStream===ts);
 const done=s=>M.some(x=>sameEx(x,s)),total=YEARS.length*2*S.cats.length,n=M.length;
 return`<div class="card"><div class="row"><div><label>المادة</label><select id="ms">${opts(Object.keys(SUBJECTS),mapSub)}</select></div><div><label>الشعبة</label><select id="mt">${opts(S.ts,ts)}</select></div></div>
<div class="item" style="margin-top:12px"><b>${n} / ${total} تمرين</b><b>${M.reduce((a,s)=>a+s.score,0)} نقطة</b></div><div class="bar" style="margin-top:8px"><i style="width:${n/total*100}%"></i></div></div>
<div class="card">`+YEARS.map(y=>`<div class="yr"><b>${y}</b><div>${TOPICS.map(t=>`<div class="item" style="justify-content:flex-start;gap:8px"><span class="mute" style="width:90px">${t}</span><span class="dots">${S.cats.map(c=>`<b class="${done({subject:mapSub,topic:t,topicStream:ts,category:c,year:y})?"on":""}" title="${esc(c)}"></b>`).join("")}</span></div>`).join("")}</div></div>`).join("")+`</div>`}
function wireLists(){document.querySelectorAll("[data-lb]").forEach(b=>b.onclick=()=>{lb=b.dataset.lb;show()});
 const ms=$("#ms");if(ms){ms.onchange=()=>{mapSub=ms.value;show()};$("#mt").onchange=e=>{mapStr=e.target.value;show()}}
 document.querySelectorAll("[data-hide]").forEach(b=>b.onclick=()=>updateDoc(doc(db,"submissions",b.dataset.hide),{hideForStudent:true}));
 document.querySelectorAll("[data-det]").forEach(b=>b.onclick=()=>{const s=ALL.find(x=>x.id===b.dataset.det);modal(`<h2>تفاصيل الحل</h2>${stat(s)}<pre>${esc(s.adminNote||"لم يُراجع بعد.")}</pre>`)});
 document.querySelectorAll(".thumbs img").forEach(i=>i.onclick=()=>modal(`<img class="big" src="${ALL.find(x=>x.id===i.dataset.id).images[i.dataset.i]}">`))}

/* ---------- المشرف ---------- */
function adminV(){return tabs([["reviews","📥 التقييمات"],["keys","🔑 مفاتيح AI"],["users","👥 الطلاب"]])+`<div id="v">${{reviews:revV,keys:keysV,users:usersV}[tab]()}</div>`}
const revV=()=>ALL.length?ALL.map(s=>`<div class="card"><div class="item"><div><b>${esc(s.studentName)}</b> <span class="mute">${esc(s.studentStream)}</span></div>${stat(s)}</div><div>${tags(s)}<span class="tag">${esc(s.topicStream)}</span></div>
<div class="mute">🕒 ${fmt(s.timestamp)}</div>${s.studentNote?`<div class="mute">ملاحظة: ${esc(s.studentNote)}</div>`:""}${thumbs(s)}
<div class="row" style="margin-top:10px"><button class="btn sm" data-det="${s.id}">التفاصيل</button><button class="btn sm" data-ten="${s.id}">علامة 10</button><button class="btn red sm" data-del="${s.id}">حذف</button></div></div>`).join(""):`<div class="card mute">📥 لا توجد تقييمات بعد.</div>`;
const keysV=()=>`<div class="card"><h2>مفاتيح Gemini API</h2><p class="mute">تُستعمل بالتناوب العشوائي، وإذا فشل مفتاح يُجرَّب التالي.</p><div class="row" style="margin-top:10px"><input id="nk" placeholder="AIza…" style="flex:3"><button class="btn" id="ak">إضافة</button></div></div>`+KEYS.map(k=>`<div class="card item"><code>${esc(k.key.slice(0,8))}••••${esc(k.key.slice(-4))}</code><button class="btn red sm" data-dk="${k.id}">حذف</button></div>`).join("");
function usersV(){const g={};ALL.forEach(s=>{(g[s.studentName]??={n:s.studentName,st:s.studentStream,p:0,c:0}).c++;if(graded(s))g[s.studentName].p+=s.score});
 return Object.values(g).map(u=>`<div class="card item"><div><b>${esc(u.n)}</b><div class="mute">${esc(u.st)} · ${u.p} نقطة · ${u.c} إرسال</div></div><button class="btn sm" data-u="${esc(u.n)}">حلوله</button></div>`).join("")||`<div class="card mute">👥 لا طلاب بعد.</div>`}
function wireAdmin(){wireTabs();wireLists();
 document.querySelectorAll("[data-ten]").forEach(b=>b.onclick=()=>updateDoc(doc(db,"submissions",b.dataset.ten),{score:10,status:"graded"}));
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>confirm("حذف هذا التقييم؟")&&deleteDoc(doc(db,"submissions",b.dataset.del)));
 document.querySelectorAll("[data-dk]").forEach(b=>b.onclick=()=>deleteDoc(doc(db,KEYS_COL,b.dataset.dk)));
 const ak=$("#ak");if(ak)ak.onclick=async()=>{const k=$("#nk").value.trim();if(k){await addDoc(collection(db,KEYS_COL),{key:k});}};
 document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const L=ALL.filter(s=>s.studentName===b.dataset.u);
  modal(`<h2>حلول ${esc(b.dataset.u)}</h2>`+L.map(s=>`<div class="card"><div class="item">${stat(s)}<button class="btn red sm" data-del2="${s.id}">حذف</button></div>${tags(s)}<div class="mute">${fmt(s.timestamp)}</div></div>`).join(""));
  document.querySelectorAll("[data-del2]").forEach(x=>x.onclick=async()=>{if(confirm("حذف الحل؟")){await deleteDoc(doc(db,"submissions",x.dataset.del2));x.closest(".card").remove()}})})}

const lvl=p=>p<10?"🌱 مبتدئ":p<40?"📘 مجتهد":p<100?"🔥 متألق":"🏆 بطل البكالوريا";
const DECO={default:["📐","✏️","📚","🧪"],purple:["🔮","✨","🌙","💫"],blue:["🌊","🐬","🫧","⛵"],gold:["👑","🏅","⭐","💎"]};
function rain(a){for(let i=0;i<28;i++){const e=document.createElement("i");e.className="fall";e.textContent=a[i%a.length];e.style.cssText=`left:${Math.random()*100}vw;animation-delay:${Math.random()*.9}s;font-size:${18+Math.random()*22}px`;document.body.append(e);setTimeout(()=>e.remove(),3800)}}
const burst=t=>rain(DECO[t]);
show();
</script>
</body>
</html>
